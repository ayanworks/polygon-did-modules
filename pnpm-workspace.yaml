packages:
  - packages/*
  - apps/*

# pnpm 10 no longer reads `pnpm.overrides` from package.json - the overrides live here.
overrides:
  vite: npm:rolldown-vite@latest

catalog:
  "@biomejs/biome": ^2.6.4
  "@nomicfoundation/hardhat-ethers": ^4.2.2
  "@nomicfoundation/hardhat-verify": ^3.1.4
  "@openzeppelin/hardhat-upgrades": ^4.1.0
  "@types/node": ^22.20.5
  did-resolver: ^6.0.0
  ethers: ^6.17.0
  hardhat: ^3.21.2
  typescript: ~5.9.3
  uuid: ^14.0.3
  vitest: ^4.1.11

ignoredBuiltDependencies:
  - esbuild
  - es5-ext

onlyBuiltDependencies:
  - "@openwallet-foundation/askar-nodejs"
  - keccak
  - secp256k1
  - koffi
